{% macro button(url, label) %}
    <!--suppress HtmlDeprecatedAttribute -->
    <table role="presentation"
           cellpadding="0"
           cellspacing="0"
           style="margin:24px 0">
        <tr>
            <td style="background-color:#009688; border-radius:8px;">
                <a href="{{ url }}"
                   style="display:inline-block;
                          padding:12px 28px;
                          font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                          font-size:16px;
                          font-weight:600;
                          color:#ffffff;
                          text-decoration:none">{{ label }}</a>
            </td>
        </tr>
    </table>
{% endmacro %}
