# Alembic: the database migrations. Run its commands from backend/src: the database is the one of the app's
# settings (backend/src/.env or the environment), see migrations/env.py.
#
#   alembic upgrade head                                  apply every new migration
#   alembic revision --autogenerate -m "add item.price"   write a migration from the changes of app/models.py
#   alembic downgrade -1                                  undo the last migration

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# The date first, so that the files sort in the order they were made
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# A new migration is linted and formatted like the rest of the code (Ruff is installed globally)
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
