name: Pytest

permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
    paths:
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'backend/pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'backend/pyproject.toml'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway database for the tests, with the credentials of the local WSL one (backend/tests/conftest.py)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements-dev.txt
      # The settings come from backend/tests/conftest.py; src must stay 100% covered, lines and branches
      - name: Test with pytest
        run: |
          pytest -c pyproject.toml tests --cov --cov-fail-under=100
