# nginx in front of the application: TLS, the security headers, the request size limit and the client address.
#
# The browser talks only to the Next.js server (it proxies /api/v1/* to the backend itself), so nginx has one
# upstream. Neither the Next.js server (127.0.0.1:5173) nor the backend (127.0.0.1:8000) may be reachable from
# outside: both trust the X-Forwarded-For that nginx sets below.
#
# Before use: replace example.com, the certificate paths and, if changed, the upstream port.
# Install: copy to /etc/nginx/sites-available/, link into sites-enabled/, then `nginx -t && systemctl reload nginx`.
# Run the backend with `uvicorn ... --proxy-headers` (it trusts 127.0.0.1 by default), with ENVIRONMENT=production.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/access-app.log;
    error_log /var/log/nginx/error-app.log;

    # The API takes small JSON bodies and a login form: nothing larger gets to the application
    client_max_body_size 64k;

    # Security headers, for every response (pages, API answers and errors alike).
    # HSTS: two years; add "preload" only after reading https://hstspreload.org
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # CSP: everything from this origin only. 'unsafe-inline' is needed by Next.js (its inline bootstrap scripts,
    # the theme script of next-themes) and by inline styles; a nonce-based policy would have to be generated by
    # the application on every request. No third-party origins are allowed: add them here when the site needs any.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Hidden files (like .env) are never served
    location ~ /\. { deny all; }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The real peer address REPLACES whatever the client sent ($proxy_add_x_forwarded_for would append to it):
        # the rate limiters of the backend count requests per this address
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 60s;
    }
}
